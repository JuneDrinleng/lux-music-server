name: Sync GHCR to Docker Hub

# 把已在 GHCR 发布的版本镜像复制到 Docker Hub（不重建、不改 tag / Release）。
# 用于 Hub 推送上线前已发布的版本（如 0.1.0-dev.10）。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不含 v），如 0.1.0-dev.10 或 0.1.0'
        required: true
        type: string
      prerelease:
        description: '是否为开发版（与 release 流程一致）'
        required: true
        type: boolean
        default: true
  push:
    branches: [dev]
    paths:
      - '.github/triggers/sync-dockerhub/**'

permissions:
  contents: read
  packages: read

env:
  IMAGE: ghcr.io/junedrinleng/lux-music-server

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR（读取源镜像）
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 解析同步参数
        id: params
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
            echo "pre=$INPUT_PRE" >> "$GITHUB_OUTPUT"
          else
            trigger="$(find .github/triggers/sync-dockerhub -type f ! -name '.gitkeep' | head -1)"
            if [ -z "$trigger" ]; then
              echo "缺少 workflow_dispatch 参数或 push trigger 文件" >&2
              exit 1
            fi
            version="$(basename "$trigger")"
            pre=true
            if grep -q '^prerelease=false' "$trigger" 2>/dev/null; then
              pre=false
            fi
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "pre=$pre" >> "$GITHUB_OUTPUT"
            echo "来自 trigger：$trigger (prerelease=$pre)"
          fi

      - name: 复制镜像 tag
        env:
          VERSION: ${{ steps.params.outputs.version }}
          PRE: ${{ steps.params.outputs.pre }}
          HUB_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/lux-music-server
        run: |
          set -euo pipefail
          pre_arg=false
          [ "$PRE" = true ] && pre_arg=true
          if ! docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "GHCR 上不存在 $IMAGE:$VERSION" >&2
            exit 1
          fi
          while IFS= read -r src; do
            [ -z "$src" ] && continue
            dst="${src/$IMAGE/$HUB_IMAGE}"
            echo "同步 $src -> $dst"
            docker buildx imagetools create "$src" -t "$dst"
          done < <(node scripts/image-tags.mjs "$IMAGE" "$VERSION" "$pre_arg")
