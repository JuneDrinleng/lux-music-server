name: CI

# PR 与 push 到 dev、master 都跑：服务端构建、管理台构建、测试，以及镜像冒烟。
# 覆盖原 PR #1 的 test.yml（那边 rebase 时丢掉自己的这份文件即可）。
on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build, admin UI, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out git repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build server and admin UI
        run: npm run build

      - name: Test
        run: npm test

      - name: Validate fnOS Compose
        run: docker compose -f deploy/fnos/docker-compose.yml --env-file deploy/fnos/.env.example config -q

  docker-smoke:
    name: Docker image serves /hello
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out git repository
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --build-arg VERSION=0.0.0-ci -t lux:ci .

      - name: Verify OCI labels and version defaults
        run: |
          docker image inspect lux:ci > /tmp/lux-image.json
          python3 - <<'PYTHON'
          import json
          image = json.load(open('/tmp/lux-image.json'))[0]['Config']
          labels = image['Labels']
          for key in ('title', 'description', 'source', 'url', 'version', 'revision', 'created', 'licenses'):
              assert labels.get('org.opencontainers.image.' + key), key
          assert labels['org.opencontainers.image.version'] == '0.0.0-ci'
          assert labels['org.opencontainers.image.revision'] == 'unknown'
          assert labels['org.opencontainers.image.licenses'] == 'Apache-2.0'
          assert 'LUX_VERSION=0.0.0-ci' in image['Env']
          PYTHON

      - name: Run and require /hello, non-root process, and healthy status
        run: |
          set -euo pipefail
          data_dir="$(mktemp -d)"
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker logs lux-ci || true
              docker inspect lux-ci || true
            fi
            docker rm -fv lux-ci >/dev/null 2>&1 || true
            docker run --rm -v "$data_dir:/server/data" alpine sh -c 'rm -rf /server/data/*' || true
            rmdir "$data_dir" || true
            exit "$status"
          }
          trap cleanup EXIT

          # A real root-owned account store, including restrictive permissions.
          docker run --rm -v "$data_dir:/server/data" alpine sh -c '
            set -eu
            mkdir -p /server/data/data/lux
            echo "{\"version\":1,\"users\":[],\"invites\":[]}" > /server/data/data/lux/accounts.json
            chmod 700 /server/data/data /server/data/data/lux
            chmod 600 /server/data/data/lux/accounts.json
            chown -R 0:0 /server/data
            test "$(stat -c %u /server/data/data/lux/accounts.json)" = 0
          '

          for scenario in fresh root-owned; do
            mount=()
            if [ "$scenario" = root-owned ]; then
              mount=(-v "$data_dir:/server/data")
            fi
            docker run -d --name lux-ci -p 9527:9527 -e LUX_TOKEN_SECRET=ci-only "${mount[@]}" lux:ci
            ok=0
            for _ in $(seq 1 60); do
              body=$(curl -fsS http://127.0.0.1:9527/hello 2>/dev/null || true)
              body=${body//$'\r'/}
              body=${body%$'\n'}
              health=$(docker inspect --format '{{.State.Health.Status}}' lux-ci)
              if [ "$body" = 'Hello~::^-^::~v4~' ] && [ "$health" = healthy ]; then
                ok=1
                break
              fi
              sleep 1
            done
            if [ "$ok" != 1 ]; then
              echo "$scenario: /hello or health check failed within 60 seconds" >&2
              exit 1
            fi
            # docker exec defaults to root; inspect the actual PID 1 server instead.
            if [ "$scenario" = root-owned ]; then
              docker exec lux-ci test -f /server/data/data/lux/accounts.json
            fi
            docker exec lux-ci sh -c '
              set -eu
              test "$(tr "\\0" " " < /proc/1/cmdline)" = "node index.js "
              test "$(awk "/^Uid:/ { print \$2 }" /proc/1/status)" = 1000
              if [ -f /server/data/data/lux/accounts.json ]; then test "$(stat -c %u /server/data/data/lux/accounts.json)" = 1000; fi
              test -z "$(find /server/data ! -user node -o ! -group node)"
            '
            docker rm -fv lux-ci
          done

  docker-arm64:
    name: Docker arm64 build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out git repository
        uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build arm64 image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max
