services:
  lux-music-server:
    build:
      context: .
      dockerfile: Dockerfile
    # 本地构建。已发布镜像：ghcr.io/junedrinleng/lux-music-server（稳定版 :latest，开发版 :dev）
    image: lux-music-server:local
    container_name: lux-music-server
    restart: unless-stopped
    ports:
      - "9527:9527"
    environment:
      NODE_ENV: production
      PORT: "9527"
      BIND_IP: 0.0.0.0
      DATA_PATH: /server/data/data
      LOG_PATH: /server/data/logs
      # 生产环境建议设置固定值，避免容器重建后登录态全部失效。
      # LUX_TOKEN_SECRET: change-me   # 生产必须设置
      # LUX_BOOTSTRAP_TOKEN: change-me  # 远程首次建管理员时需要
      # LUX_ADMIN_USER: admin
      # LUX_ADMIN_PASSWORD: change-me
      # 如使用反向代理，请设置真实 IP 请求头，并在代理中传递该 header。
      # PROXY_HEADER: x-real-ip
      # 一起听（单实例内存房间；多副本不支持）
      # LUX_TOGETHER_MAX_MEMBERS: "10"
      # LUX_TOGETHER_MAX_ROOMS: "100"
      # LUX_TOGETHER_GRACE_MS: "30000"
      # Lux 模式服务端音源解析（可选）
      # LUX_SOURCE_TIMEOUT_MS: "15000"
      # LUX_SOURCE_MEMORY_MB: "128"
      # LUX_SOURCE_PROXY_STREAM: "false"
    volumes:
      - lux-music-server-data:/server/data

volumes:
  lux-music-server-data:
